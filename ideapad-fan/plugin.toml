id           = "heprado/ideapad-fan"
name         = "IdeaPad Fan Mode"
version      = "2.0.0"
plugin_api   = 24
author       = "heprado"
license      = "MIT"
icon         = "car-fan"
description  = "Bar widget with quiet / normal / game presets for Lenovo IdeaPads: the firmware fan mode (ideapad_acpi) together with the power profile (power-profiles-daemon)."
tags         = ["bar", "hardware", "system", "lenovo", "fan", "power"]
dependencies = []

[[setting]]
key             = "show_label"
type            = "bool"
label_key       = "settings.show_label.label"
description_key = "settings.show_label.description"
default         = true

[[setting]]
key             = "manage_power_profile"
type            = "bool"
label_key       = "settings.manage_power_profile.label"
description_key = "settings.manage_power_profile.description"
default         = true

[[setting]]
key             = "restore_on_start"
type            = "bool"
label_key       = "settings.restore_on_start.label"
description_key = "settings.restore_on_start.description"
default         = true

[[widget]]
id    = "widget"
entry = "widget.luau"

[[service]]
id    = "service"
entry = "service.luau"
